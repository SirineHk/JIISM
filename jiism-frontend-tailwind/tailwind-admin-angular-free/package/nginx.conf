server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular est une SPA : toute route inconnue retombe sur index.html
    # (le routeur Angular gère ensuite la navigation côté client).
    location / {
        try_files $uri $uri/ /index.html;
    }
}