<div class="flex h-screen w-full items-center justify-center overflow-hidden p-2">

  <mat-card class="cardWithShadow overflow-hidden auth-card mx-auto mb-0">

    <div class="grid grid-cols-12 gap-6">

      <div class="lg:col-span-6 col-span-12 flex items-stretch">

        <div class="w-full p-10 flex flex-col justify-center">

          <div class="text-center text-xl font-semibold">
            Créer un compte
          </div>

          <form
            class="mt-8"
            [formGroup]="form"
            (ngSubmit)="submit()"
          >

            <!-- Username -->
            <mat-label class="mat-subtitle-2 text-sm font-semibold mb-3 block">
              Username
            </mat-label>

            <mat-form-field
              appearance="outline"
              class="w-full"
              color="primary"
            >

              <input
                matInput
                formControlName="uname"
                placeholder="Votre username"
              />

            </mat-form-field>

            <!-- Email -->
            <mat-label class="mat-subtitle-2 text-sm font-semibold mb-3 block">
              Email
            </mat-label>

            <mat-form-field
              appearance="outline"
              class="w-full"
              color="primary"
            >

              <input
                matInput
                type="email"
                formControlName="email"
                placeholder="votre@email.com"
              />

            </mat-form-field>

            <!-- Password -->
            <mat-label class="mat-subtitle-2 text-sm font-semibold mb-3 block">
              Password
            </mat-label>

            <mat-form-field
              appearance="outline"
              class="w-full"
              color="primary"
            >

              <input
                matInput
                type="password"
                formControlName="password"
                placeholder="Mot de passe"
              />

            </mat-form-field>

            <!-- Error -->
            <div
              *ngIf="errorMessage"
              class="text-red-600 text-sm mb-4"
            >
              {{ errorMessage }}
            </div>

            <!-- Success -->
            <div
              *ngIf="successMessage"
              class="text-green-600 text-sm mb-4"
            >
              {{ successMessage }}
            </div>

            <!-- Submit -->
            <button
              type="submit"
              mat-flat-button
              color="primary"
              class="w-full"
              [disabled]="loading"
            >
              {{ loading ? 'Inscription...' : 'Sign Up' }}
            </button>

          </form>

          <span class="block font-medium text-center mt-6">

            Already have an Account?

            <a
              [routerLink]="['/authentication/login']"
              class="no-underline text-primary font-medium text-sm"
            >
              Sign In
            </a>

          </span>

        </div>

      </div>

      <div
        class="lg:col-span-6 col-span-12 relative hidden lg:flex justify-center items-stretch bg-light p-5"
      >

        <div class="flex items-center justify-center w-full">

          <img
            src="/assets/images/backgrounds/login-bg.svg"
            alt="register"
            class="img-fluid object-cover"
          />

        </div>

      </div>

    </div>

  </mat-card>

</div>
