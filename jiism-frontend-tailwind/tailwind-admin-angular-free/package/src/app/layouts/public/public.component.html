<div class="min-h-screen bg-slate-50">

  <!-- Navigation publique -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">

    <div class="max-w-7xl mx-auto px-6">

      <div class="h-16 flex items-center justify-between">

        <!-- Logo -->
        <a
          routerLink="/publications"
          class="flex items-center gap-3">

          <div
            class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold">
            J
          </div>

          <div>
            <div class="font-bold text-slate-900">
              JIISM
            </div>

            <div class="text-xs text-slate-400">
              Journal scientifique
            </div>
          </div>

        </a>

        <!-- Menu -->
        <nav class="flex items-center gap-2">

          <a
            routerLink="/publications"
            routerLinkActive="bg-indigo-50 text-indigo-700"
            [routerLinkActiveOptions]="{ exact: true }"
            class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition">

            Publications

          </a>

          <a
            routerLink="/announcements"
            routerLinkActive="bg-indigo-50 text-indigo-700"
            class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition">

            Annonces

          </a>

          <a
            routerLink="/authentication/login"
            class="ml-2 px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 transition">

            Connexion

          </a>

        </nav>

      </div>

    </div>

  </header>


  <!-- Contenu de la page -->
  <main>
    <router-outlet></router-outlet>
  </main>


  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 mt-12">

    <div class="max-w-7xl mx-auto px-6 py-6 text-center">

      <p class="text-sm text-slate-500">
        © 2026 JIISM — Journal scientifique
      </p>

    </div>

  </footer>

</div>
